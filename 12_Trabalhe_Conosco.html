  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor: #404040\">Por que CAL<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M5 6.5L8 9.5L11 6.5\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"cal-nav-i\" style=\"font-family: Nunito, sans-serif; font-weight: 800; font-size: 14px; line-height: 19px; color: #404040\">Ciclos<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M5 6.5L8 9.5L11 6.5\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"cal-nav-i\" style=\"font-family: Nunito, sans-serif; font-weight: 800; font-size: 14px; line-height: 19px; color: #404040\">Além da Sala de Aula<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M5 6.5L8 9.5L11 6.5\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"cal-nav-i\" style=\"font-family: Nunito, sans-serif; font-weight: 800; font-size: 14px; line-height: 19px; color: #404040\">Resultados para a Vida<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M5 6.5L8 9.5L11 6.5\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"cal-nav-i\" style=\"font-family: Nunito, sans-serif; font-weight: 800; font-size: 14px; line-height: 19px; color: #404040\">Comunidade CAL<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M5 6.5L8 9.5L11 6.5\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<\u002Fdiv>\n<a class=\"cal-cta bt\" href=\"#visita\" style=\"display: flex; align-items: center; justify-content: center; background: #20409a; color: #ffffff; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800; font-size: 14px; line-height: 16px\">Agende uma Visita<\u002Fa>\n<button class=\"cal-burger\" type=\"button\" aria-label=\"Abrir menu\" style=\"background: #20409a; border: 0; cursor: pointer\"><svg width=\"22\" height=\"16\" sc-camel-view-box=\"0 0 22 16\"><path d=\"M2 2H20M2 8H20M2 14H20\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ ABERTURA + FORMULÁRIO ============ -->\n<section id=\"topo\" class=\"ag-w ag-hero {{ cls.topo }}\">\n<div class=\"ag-top\">\n<div class=\"ag-tag rv\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #6b6b6b\">Trabalhe conosco · Colégio Augusto Laranja<\u002Fdiv>\n<h1 class=\"ag-h1\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #f36f21\"><span class=\"cal-ln\"><span>Venha fazer parte do CAL<\u002Fspan><\u002Fspan><\u002Fh1>\n<\u002Fdiv>\n<div>\n<p class=\"ag-lead rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #20409a\">Com mais de 50 anos de história, o CAL valoriza o capital humano.<\u002Fp>\n<div class=\"ag-txt rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 500; color: #20409a\"><p>Buscamos manter um ambiente de trabalho motivador, transparente e desafiador. Se você quer fazer parte da nossa equipe, cadastre seu currículo no formulário.<\u002Fp><p class=\"tc-hash\" style=\"font-weight: 900; color: #f36f21\">#VemProCAL!<\u002Fp><\u002Fdiv>\n<div class=\"ag-btns rv d1\">\n<a class=\"ag-b bt\" href=\"#curriculo\" style=\"color: #ffffff; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Cadastre o seu currículo<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 10H16M11 5L16 10L11 15\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a class=\"ag-b bt bt-light\" href=\"#beneficios\" style=\"color: #20409a; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Ver benefícios<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"tc-wrap\">\n<svg class=\"tc-card-g\" sc-camel-view-box=\"-6 -6 112 112\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"none\" stroke=\"#f36f21\" stroke-width=\"8\" vector-effect=\"non-scaling-stroke\"><\u002Fcircle><\u002Fsvg>\n<div id=\"curriculo\" class=\"tc-card rv d1\">\n<sc-if value=\"{{ vis.form }}\" hint-placeholder-val=\"{{ true }}\">\n<form sc-camel-on-submit=\"{{ h.prevent }}\" aria-label=\"Formulário de envio de currículo\" style=\"position: relative; font-family: Nunito, sans-serif\">\n<h2 class=\"tc-ct\" style=\"font-weight: 900; color: #20409a\">Anexe seu currículo abaixo<\u002Fh2>\n<div class=\"tc-fld\">\n<label class=\"tc-lb\" for=\"tc-nome\" style=\"font-weight: 800; color: #20409a\">Nome<\u002Flabel>\n<input id=\"tc-nome\" class=\"fi\" type=\"text\" autocomplete=\"name\" placeholder=\"Seu nome\" value=\"{{ f.nome }}\" sc-camel-on-change=\"{{ h.nome }}\">\n<\u002Fdiv>\n<div class=\"tc-fld\">\n<label class=\"tc-lb\" for=\"tc-email\" style=\"font-weight: 800; color: #20409a\">E-mail<\u002Flabel>\n<input id=\"tc-email\" class=\"fi\" type=\"email\" autocomplete=\"email\" sc-camel-input-mode=\"email\" placeholder=\"Seu e-mail\" value=\"{{ f.email }}\" sc-camel-on-change=\"{{ h.email }}\">\n<\u002Fdiv>\n<div class=\"tc-fld\">\n<label class=\"tc-lb\" for=\"tc-cv\" style=\"font-weight: 800; color: #20409a\">Currículo<\u002Flabel>\n<label class=\"up {{ up.cls }}\" for=\"tc-cv\">\n<input id=\"tc-cv\" class=\"up-in\" type=\"file\" accept=\".pdf,.doc,.docx\" sc-camel-on-change=\"{{ h.file }}\">\n<span class=\"up-t\" style=\"font-weight: 700; color: #404040\">{{ up.txt }}<\u002Fspan>\n<span class=\"up-b\" style=\"font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">{{ up.btn }}<\u002Fspan>\n<\u002Flabel>\n<span class=\"tc-hint\" style=\"font-weight: 600; color: #6b6b6b\">Formatos aceitos: PDF, DOC ou DOCX.<\u002Fspan>\n<sc-if value=\"{{ err.show }}\" hint-placeholder-val=\"{{ false }}\">\n<span class=\"tc-err\" role=\"alert\" style=\"font-weight: 700\">{{ err.txt }}<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div class=\"tc-send\">\n<button class=\"ag-b bt\" type=\"button\" sc-camel-on-click=\"{{ h.submit }}\" disabled=\"{{ ok.dis }}\" style=\"color: #ffffff; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Enviar currículo<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 10H16M11 5L16 10L11 15\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<span class=\"tc-st\" role=\"status\" style=\"font-weight: 700; color: #6b6b6b\">{{ ok.txt }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fform>\n<\u002Fsc-if>\n<sc-if value=\"{{ vis.sent }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"tc-ok\" role=\"status\" style=\"position: relative; font-family: Nunito, sans-serif\">\n<svg class=\"tc-ok-ic\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><circle cx=\"32\" cy=\"32\" r=\"29\" fill=\"none\" stroke=\"#f36f21\" stroke-width=\"6\"><\u002Fcircle><path d=\"M19 33L28 42L45 23\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<h2 class=\"tc-ct\" style=\"font-weight: 900; color: #20409a\">Currículo recebido, {{ ok.first }}!<\u002Fh2>\n<p style=\"font-weight: 500; color: #20409a\">Obrigado pelo interesse em fazer parte do CAL. #VemProCAL!<\u002Fp>\n<button class=\"ag-b bt bt-light\" type=\"button\" sc-camel-on-click=\"{{ h.again }}\" style=\"color: #20409a; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Enviar outro currículo<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 01 BEM VIVER ============ -->\n<section id=\"bemviver\" class=\"ag-w tc-sec {{ cls.bem }}\">\n<div class=\"tc-top\">\n<div class=\"ag-tag\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #6b6b6b\">01 · Bem-estar<\u002Fdiv>\n<h2 class=\"ag-h2\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #f36f21\"><span class=\"cal-ln\"><span>Programa Bem Viver<\u002Fspan><\u002Fspan><\u002Fh2>\n<\u002Fdiv>\n<div class=\"tc-2\">\n<div class=\"ag-txt rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 500; color: #20409a\"><p>Um programa voltado a colaboradores e familiares, com iniciativas que cuidam do corpo, da mente e da convivência.<\u002Fp><\u002Fdiv>\n<ul class=\"tc-list\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #20409a\">\n<li class=\"tc-li\"><i><\u002Fi><span>Aulas presenciais de Yoga e Meditação<\u002Fspan><\u002Fli>\n<li class=\"tc-li\"><i><\u002Fi><span>Grupo de Coral Augusto Laranja<\u002Fspan><\u002Fli>\n<li class=\"tc-li\"><i><\u002Fi><span>Espaço físico para atividades como vôlei e futsal<\u002Fspan><\u002Fli>\n<li class=\"tc-li\"><i><\u002Fi><span>Convênio com o Sesc<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 02 BENEFÍCIOS ============ -->\n<section id=\"beneficios\" class=\"tc-ben {{ cls.ben }}\">\n<svg class=\"tc-ben-g\" sc-camel-view-box=\"-6 -6 112 112\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"none\" stroke=\"#f36f21\" stroke-width=\"8\" vector-effect=\"non-scaling-stroke\"><\u002Fcircle><\u002Fsvg>\n<div class=\"ag-w\">\n<div class=\"tc-top\">\n<div class=\"ag-tag\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #6b6b6b\">02 · Para quem faz o CAL<\u002Fdiv>\n<h2 class=\"ag-h2\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #f36f21\"><span class=\"cal-ln\"><span>Benefícios<\u002Fspan><\u002Fspan><\u002Fh2>\n<\u002Fdiv>\n<ul class=\"tc-bg\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #20409a\">\n<li class=\"tc-bc\"><span class=\"tc-n\" style=\"font-weight: 900\">01<\u002Fspan><span class=\"tc-bt\">Assistência médica<\u002Fspan><\u002Fli>\n<li class=\"tc-bc\"><span class=\"tc-n\" style=\"font-weight: 900\">02<\u002Fspan><span class=\"tc-bt\">Assistência odontológica<\u002Fspan><\u002Fli>\n<li class=\"tc-bc\"><span class=\"tc-n\" style=\"font-weight: 900\">03<\u002Fspan><span class=\"tc-bt\">Bolsa-auxílio<\u002Fspan><\u002Fli>\n<li class=\"tc-bc\"><span class=\"tc-n\" style=\"font-weight: 900\">04<\u002Fspan><span class=\"tc-bt\">Vale-alimentação<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 03 DIVERSIDADE ============ -->\n<section id=\"diversidade\" class=\"ag-w tc-div {{ cls.div }}\">\n<div class=\"tc-dv\">\n<div>\n<div class=\"ag-tag\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: rgba(255,255,255,.82)\">03 · Diversidade e inclusão<\u002Fdiv>\n<p class=\"tc-dv-t rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #ffffff\">O CAL valoriza a diversidade e a inclusão e incentiva candidaturas de pessoas de qualquer origem ou condição.<\u002Fp>\n<\u002Fdiv>\n<svg class=\"tc-dots\" sc-camel-view-box=\"0 0 96 96\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"#f36f21\" stroke-width=\"3\"><circle cx=\"14\" cy=\"14\" r=\"9\"><\u002Fcircle><circle cx=\"48\" cy=\"14\" r=\"9\"><\u002Fcircle><circle cx=\"82\" cy=\"14\" r=\"9\"><\u002Fcircle><circle cx=\"14\" cy=\"48\" r=\"9\"><\u002Fcircle><circle cx=\"48\" cy=\"48\" r=\"9\"><\u002Fcircle><circle cx=\"82\" cy=\"48\" r=\"9\"><\u002Fcircle><circle cx=\"14\" cy=\"82\" r=\"9\"><\u002Fcircle><circle cx=\"48\" cy=\"82\" r=\"9\"><\u002Fcircle><circle cx=\"82\" cy=\"82\" r=\"9\"><\u002Fcircle><\u002Fg><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHAMADA FINAL ============ -->\n<div id=\"visita\" class=\"ag-w ag-stmt tc-end {{ cls.visita }}\">\n< de', 'visita'];\n    this.state = {\n      seen: {},\n      f: { nome: '', email: '', arq: '' },\n      err: '',\n      sent: false\n    };\n    this.setRoot = (el) => { if (el && el !== this.root) { this.root = el; if (this.ready) this.measure(); } };\n    this.onScroll = () => {\n      if (this.raf) return;\n      this.raf = requestAnimationFrame(() => { this.raf = 0; this.measure(); });\n    };\n    this.h = {\n      nome: (e) => this.upd({ nome: e && e.target ? e.target.value : '' }),\n      email: (e) => this.upd({ email: ((e && e.target ? e.target.value : '') || '').replace(/\\s/g, '') }),\n      file: (e) => {\n        const fl = e && e.target && e.target.files ? e.target.files[0] : null;\n        if (!fl) { this.setState({ f: Object.assign({}, this.state.f, { arq: '' }), err: '' }); return; }\n        if (!/\\.(pdf|doc|docx)$/i.test(fl.name)) {\n          this.setState({ f: Object.assign({}, this.state.f, { arq: '' }), err: 'Envie o currículo em PDF, DOC ou DOCX.' });\n          return;\n        }\n        this.setState({ f: Object.assign({}, this.state.f, { arq: fl.name }), err: '' });\n      },\n      prevent: (e) => { if (e && e.preventDefault) e.preventDefault(); },\n      submit: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        if (!this.valid(this.state.f).every(Boolean)) return;\n        this.setState({ sent: true });\n      },\n      again: () => this.setState({ sent: false, err: '', f: { nome: '', email: '', arq: '' } })\n    };\n  }\n  valid(f) {\n    return [\n      (f.nome || '').trim().length >= 3,\n      /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(f.email || ''),\n      !!f.arq\n    ];\n  }\n  upd(patch) {\n    this.setState({ f: Object.assign({}, this.state.f, patch) });\n  }\n  componentDidMount() {\n    this.ffScroll = () => {\n      if (this.rafFS) return;\n      this.rafFS = requestAnimationFrame(() => {\n        this.rafFS = 0;\n        const el = (this.root && this.root.querySelector && this.root.querySelector('.cal-ff')) || (typeof document !== 'undefined' ? document.querySelector('.cal-ff') : null);\n        if (!el) return;\n        const top = el.getBoundingClientRect().top;\n        if (this.topFF != null && top !== this.topFF) this.quica(this.topFF - top);\n        this.topFF = top;\n      });\n    };\n    window.addEventListener('scroll', this.ffScroll, { passive: true, capture: true });\n    window.addEventListener('scroll', this.onScroll, { passive: true, capture: true });\n    window.addEventListener('resize', this.onScroll);\n    const liberar = () => {\n      if (this.ready) return;\n      this.ready = true;\n      this.measure();\n      this.topoT = setTimeout(() => this.setState({ seen: Object.assign({}, this.state.seen, { topo: true }) }), 350);\n      this.reT = setTimeout(() => this.measure(), 900);\n    };\n    this.revT = setTimeout(() => {\n      if (typeof IntersectionObserver !== 'undefined' && this.root) {\n        this.ioRaiz = new IntersectionObserver((e) => {\n          if (e && e[0] && e[0].isIntersecting) { this.ioRaiz.disconnect(); setTimeout(liberar, 150); }\n        });\n        this.ioRaiz.observe(this.root);\n      }\n      this.fallT = setTimeout(liberar, 1400);\n    }, 250);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.ffScroll, { capture: true });\n    window.removeEventListener('scroll', this.onScroll, { capture: true });\n    window.removeEventListener('resize', this.onScroll);\n    if (this.rafFS) cancelAnimationFrame(this.rafFS);\n    if (this.rafF) cancelAnimationFrame(this.rafF);\n    if (this.raf) cancelAnimationFrame(this.raf);\n    [this.revT, this.topoT, this.fallT, this.reT].forEach((t) => { if (t) clearTimeout(t); });\n    if (this.ioRaiz) this.ioRaiz.disconnect();\n  }\n  q(id) {\n    if (this.root) { const el = this.root.querySelector('#' + id); if (el) return el; }\n    return typeof document !== 'undefined' ? document.getElementById(id) : null;\n  }\n  measure() {\n    if (!this.ready) return;\n    const vh = window.innerHeight || 1000;\n    const tall = vh > 2600;\n    const seen = Object.assign({}, this.state.seen || {});\n    let sc = false;\n    for (let i = 0; i < this.tIds.length; i++) {\n      const id = this.tIds[i];\n      if (seen[id]) continue;\n      const el = this.q(id);\n      if (!el) continue;\n      const r = el.getBoundingClientRect();\n      if (tall || (r.height > 0 && r.top + Math.min(160, r.height * 0.3) < vh * 0.8)) { seen[id] = true; sc = true; }\n    }\n    if (sc) this.setState({ seen: seen });\n  }\n  quica(dy) {\n    if (!this.ff) this.ff = { a: 0, va: 0, b: 0, vb: 0 };\n    const f = this.ff;\n    const cl = (v) => Math.max(-300, Math.min(300, v));\n    f.va = cl(f.va + dy * 0.55);\n    f.vb = cl(f.vb + dy * 0.85);\n    if (this.rafF) return;\n    let last = 0;\n    const passo = (t) => {\n      this.rafF = 0;\n      const dt = last ? Math.min(0.034, (t - last) / 1000) : 0.016;\n      last = t;\n      f.va += (-95 * f.a - 8 * f.va) * dt; f.a += f.va * dt;\n      f.vb += (-48 * f.b - 4.2 * f.vb) * dt; f.b += f.vb * dt;\n      f.a = Math.max(-18, Math.min(18, f.a)); f.b = Math.max(-24, Math.min(24, f.b));\n      const A = Math.round(f.a * 10) / 10, B = Math.round(f.b * 10) / 10;\n      if (A !== this.state.ffA || B !== this.state.ffB) this.setState({ ffA: A, ffB: B });\n      if (Math.abs(f.a) < 0.05 && Math.abs(f.va) < 0.5 && Math.abs(f.b) < 0.05 && Math.abs(f.vb) < 0.5) {\n        f.a = f.va = f.b = f.vb = 0; this.setState({ ffA: 0, ffB: 0 }); return;\n      }\n      this.rafF = requestAnimationFrame(passo);\n    };\n    this.rafF = requestAnimationFrame(passo);\n  }\n  renderVals() {\n    const s = this.state.seen || {};\n    const f = this.state.f;\n    const v = this.valid(f);\n    const left = v.filter((x) => !x).length;\n    const nome = (f.nome || '').trim();\n    return {\n      ffA: this.state.ffA || 0, ffB: this.state.ffB || 0,\n      setRoot: this.setRoot,\n      cls: {\n        topo: s.topo ? 'is-in' : '',\n        bem: s.bemviver ? 'is-in' : '',\n        ben: s.beneficios ? 'is-in' : '',\n        div: s.diversidade ? 'is-in' : '',\n        visita: s.visita ? 'is-in' : ''\n      },\n      f: f,\n      h: this.h,\n      vis: { form: !this.state.sent, sent: !!this.state.sent },\n      up: {\n        cls: f.arq ? 'has' : '',\n        txt: f.arq || 'Nenhum arquivo selecionado',\n        btn: f.arq ? 'Trocar arquivo' : 'Escolher arquivo'\n      },\n      err: { show: !!this.state.err, txt: this.state.err },\n      ok: {\n        dis: left > 0,\n        txt: left > 0 ? (left === 1 ? 'Falta 1 campo obrigatório' : 'Faltam ' + left + ' campos obrigatórios') : 'Tudo pronto para enviar',\n        first: nome.split(/\\s+/)[0] || ''\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
