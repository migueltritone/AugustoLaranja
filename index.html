<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo Site Augusto Laranja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
  <style>
/* Novo Site Augusto Laranja - índice de links */

body {
  margin: 0;
  background: #e5e6e7;
  font-family: "Nunito", system-ui, sans-serif;
  color: #03303d;
}

a {
  color: #203f9a;
  text-decoration: none;
}

a:hover {
  color: #f36f21;
  text-decoration: underline;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 40px 64px;
}

/* Cabeçalho: título à esquerda, logos à direita */
.cabecalho {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 48px;
}

.cabecalho h1 {
  margin: 0;
  font-size: 44px;
  line-height: 46px;
  font-weight: 800;
  color: #203f9a;
}

.logos {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 32px;
}

.logo-cal {
  width: 120px;
  height: auto;
  flex-shrink: 0;
  display: block;
}

/* Logo da Tritone */
.logo-tritone {
  width: 90px;
  height: auto;
  flex-shrink: 0;
  display: block;
}

/* Box com a lista de links */
.box-links {
  background: #ffffff;
  border-radius: 24px;
  padding: 48px;
}

.box-links ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.box-links li {
  border-bottom: 1px solid #e6e7e8;
}

.box-links li:last-child {
  border-bottom: none;
}

.box-links a {
  display: block;
  padding: 12px 0;
  font-size: 18px;
  line-height: 24px;
  font-weight: 700;
}

@media (max-width: 600px) {
  .container {
    padding: 24px 16px 48px;
  }
  .cabecalho h1 {
    font-size: 32px;
    line-height: 36px;
  }
  .logos {
    justify-content: flex-start;
  }
  .box-links {
    padding: 24px;
    border-radius: 16px;
  }
}
  </style>
</head>
