document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px; line-height: 19px; color: #404040\">Resultados para a Vida<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M5 6.5L8 9.5L11 6.5\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"cal-nav-i\" style=\"font-family: Nunito, sans-serif; font-weight: 800; font-size: 14px; line-height: 19px; color: #404040\">Comunidade CAL<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M5 6.5L8 9.5L11 6.5\" fill=\"none\" stroke=\"#20409a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<\u002Fdiv>\n<a class=\"cal-cta bt\" href=\"#agendar\" style=\"display: flex; align-items: center; justify-content: center; background: #20409a; color: #ffffff; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800; font-size: 14px; line-height: 16px\">Agende uma Visita<\u002Fa>\n<button class=\"cal-burger\" type=\"button\" aria-label=\"Abrir menu\" style=\"background: #20409a; border: 0; cursor: pointer\"><svg width=\"22\" height=\"16\" sc-camel-view-box=\"0 0 22 16\"><path d=\"M2 2H20M2 8H20M2 14H20\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ ABERTURA ============ -->\n<section id=\"topo\" class=\"ag-w ag-hero {{ cls.topo }}\">\n<div class=\"ag-top\">\n<div class=\"ag-tag rv\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #6b6b6b\">Agende uma visita · Colégio Augusto Laranja<\u002Fdiv>\n<h1 class=\"ag-h1\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #f36f21\"><span class=\"cal-ln\"><span>Conheça a escola em funcionamento<\u002Fspan><\u002Fspan><\u002Fh1>\n<\u002Fdiv>\n<div>\n<p class=\"ag-lead rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #20409a\">A melhor forma de conhecer uma escola é sentir o ambiente e conversar com a equipe.<\u002Fp>\n<div class=\"ag-txt rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 500; color: #20409a\"><p>Nenhuma descrição substitui a experiência de observar a escola em seu funcionamento cotidiano: salas de aula, pátio, laboratórios e atividades em curso.<\u002Fp><p>Ao agendar uma visita, é possível constatar de que forma nossos valores institucionais se traduzem em uma rotina concreta.<\u002Fp><\u002Fdiv>\n<div class=\"ag-btns rv d1\">\n<a class=\"ag-b bt\" href=\"#agendar\" style=\"color: #ffffff; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Agendar minha visita<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 10H16M11 5L16 10L11 15\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a class=\"ag-b bt bt-light\" href=\"#duvidas\" style=\"color: #20409a; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Tirar dúvidas<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ag-art\">\n<div class=\"ag-leaf\"><img src=\"a5407b71-0119-4d7e-8b55-b37dbb26be8b\" alt=\"Dois alunos sorrindo caminhando em frente à fachada do Colégio Augusto Laranja\" style=\"object-position: 50% 50%\"><\u002Fdiv>\n<div class=\"ag-leaf-ln\"><\u002Fdiv>\n<svg class=\"ag-dots\" sc-camel-view-box=\"0 0 96 96\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"#20409a\" stroke-width=\"3\"><circle cx=\"14\" cy=\"14\" r=\"9\"><\u002Fcircle><circle cx=\"48\" cy=\"14\" r=\"9\"><\u002Fcircle><circle cx=\"82\" cy=\"14\" r=\"9\"><\u002Fcircle><circle cx=\"14\" cy=\"48\" r=\"9\"><\u002Fcircle><circle cx=\"48\" cy=\"48\" r=\"9\"><\u002Fcircle><circle cx=\"82\" cy=\"48\" r=\"9\"><\u002Fcircle><circle cx=\"14\" cy=\"82\" r=\"9\"><\u002Fcircle><circle cx=\"48\" cy=\"82\" r=\"9\"><\u002Fcircle><circle cx=\"82\" cy=\"82\" r=\"9\"><\u002Fcircle><\u002Fg><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 01 FORMULÁRIO ============ -->\n<section id=\"agendar\" class=\"ag-form {{ cls.form }}\">\n<svg class=\"ag-form-g\" sc-camel-view-box=\"-6 -6 112 112\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"none\" stroke=\"#f36f21\" stroke-width=\"8\" vector-effect=\"non-scaling-stroke\"><\u002Fcircle><\u002Fsvg>\n<div class=\"ag-w ag-form-in\">\n<div class=\"ag-hd\">\n<div class=\"ag-tag\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #6b6b6b\">01 · Agende uma visita<\u002Fdiv>\n<h2 class=\"ag-h2\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #f36f21\"><span class=\"cal-ln\"><span>Venha nos conhecer<\u002Fspan><\u002Fspan><\u002Fh2>\n\n<\u002Fdiv>\n<div class=\"ag-side\">\n<div class=\"ag-txt rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 500; color: #20409a\"><p>Conte um pouco sobre sua família. Cada resposta abre a etapa seguinte, e em menos de dois minutos sua visita está pedida.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n\n<div class=\"ag-card\">\n<sc-if value=\"{{ vis.form }}\" hint-placeholder-val=\"{{ true }}\">\n<form sc-camel-on-submit=\"{{ h.prevent }}\" aria-label=\"Formulário de agendamento de visita\" style=\"font-family: Nunito, sans-serif\">\n\n<div class=\"fs s0 {{ st.c0 }}\">\n<div class=\"fs-rail\"><span class=\"fs-dot\"><span class=\"n\">1<\u002Fspan><svg class=\"ck\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4.5 10.3L8.3 14L15.5 6.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fs-ln\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"fs-body\">\n<label class=\"fs-lb\" for=\"ag-nome\" style=\"font-weight: 800; color: #20409a\">Seu nome<\u002Flabel>\n<div class=\"fs-ctl fi-w\"><input id=\"ag-nome\" class=\"fi\" type=\"text\" autocomplete=\"name\" placeholder=\"Como devemos chamar você?\" c.minus }}\" sc-camel-on-click=\"{{ h.kMinus }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 10H16\" fill=\"none\" stroke-width=\"2.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<output class=\"stp-v\" aria-live=\"polite\" style=\"font-weight: 900; color: #20409a\">{{ kc.n }}<\u002Foutput>\n<button class=\"stp-b\" type=\"button\" aria-label=\"Aumentar número de filhos\" disabled=\"{{ kc.plus }}\" sc-camel-on-click=\"{{ h.kPlus }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 10H16M10 4V16\" fill=\"none\" stroke-width=\"2.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<span class=\"stp-l\" style=\"font-weight: 800; color: #404040\">{{ kc.lab }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vis.s4 }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"fs {{ st.c4 }}\">\n<div class=\"fs-rail\"><span class=\"fs-dot\"><span class=\"n\">5<\u002Fspan><svg class=\"ck\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4.5 10.3L8.3 14L15.5 6.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fs-ln\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"fs-body\" role=\"group\" aria-labelledby=\"ag-serie-lb\">\n<span id=\"ag-serie-lb\" class=\"fs-lb\" style=\"font-weight: 800; color: #20409a\">Qual série pretende matricular<\u002Fspan>\n<p class=\"fs-hint\" style=\"font-weight: 600; color: #6b6b6b\">Uma para cada filho, considerando o ano letivo da matrícula.<\u002Fp>\n<div class=\"fs-ctl kids\">\n<sc-for list=\"{{ kids }}\" as=\"kd\" hint-placeholder-count=\"1\">\n<div class=\"kid {{ kd.cls }}\">\n<label for=\"{{ kd.id }}\" style=\"font-weight: 800; color: #404040\">{{ kd.lab }}<\u002Flabel>\n<div class=\"fi-w\">\n<sc-raw-select id=\"{{ kd.id }} 4.5 10.3L8.3 14L15.5 6.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fs-ln\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"fs-body\" role=\"group\" aria-labelledby=\"ag-quando-lb\">\n<span id=\"ag-quando-lb\" class=\"fs-lb\" style=\"font-weight: 800; color: #20409a\">Que dia da semana e horário prefere?<\u002Fspan>\n<p class=\"fs-hint\" style=\"font-weight: 600; color: #6b6b6b\">É uma preferência: a equipe confirma a data com você.<\u002Fp>\n<div class=\"fs-ctl\">\n<span class=\"sub-k f\" style=\"font-weight: 800; color: #6b6b6b\">Dia da semana<\u002Fspan>\n<div class=\"chips\">\n<sc-for list=\"{{ dias }}\" as=\"d\" hint-placeholder-count=\"5\">\n<button class=\"chip {{ d.cls }}\" type=\"button\" aria-pressed=\"{{ d.pr }}\" aria-label=\"{{ d.L }}\" sc-camel-on-click=\"{{ d.pick }}\">{{ d.l }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span class=\"sub-k\" style=\"font-weight: 800; color: #6b6b6b\">Horário<\u002Fspan>\n<div class=\"chips wd\">\n<sc-for list=\"{{ horas }}\" as=\"hr\" hint-placeholder-count=\"6\">\n<button class=\"chip {{ hr.cls }}\" type=\"button\" aria-pressed=\"{{ hr.pr }}\" sc-camel-on-click=\"{{ hr.pick }}\">{{ hr.l }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vis.s6 }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"fs last {{ st.c6 }}\">\n<div class=\"fs-rail\"><span class=\"fs-dot\"><span class=\"n\">7<\u002Fspan><svg class=\"ck\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4.5 10.3L8.3 14L15.5 6.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"fs-ln\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"fs-body\">\n<label class=\"fs-lb\" for=\"ag-msg\" style=\"font-weight: 800; color: #20409a\">Dúvidas e comentários<span class=\"fs-opt\" style=\"font-weight: 800; color: #6b6b6b\">opcional<\u002Fspan><\u002Flabel>\n<p class=\"fs-hint\" style=\"font-weight: 600; color: #6b6b6b\">Conte o que você gostaria de ver ou perguntar durante a visita.<\u002Fp>\n<div class=\"fs-ctl\"><textarea id=\"ag-msg\" class=\"fi\" rows=\"5\" placeholder=\"Escreva aqui sua mensagem\" value=\"{{ f.msg }}\" sc-camel-on-change=\"{{ h.msg }}\"><\u002Ftextarea><\u002Fdiv>\n<sc-if value=\"{{ vis.send }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"ag-send\">\n<button class=\"ag-b bt\" type=\"button\" sc-camel-on-click=\"{{ h.submit }}\" disabled=\"{{ ok.dis }}\" style=\"color: #ffffff; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Solicitar visita<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 10H16M11 5L16 10L11 15\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<span class=\"ag-send-st\" role=\"status\" style=\"font-weight: 700; color: #6b6b6b\">{{ ok.txt }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ vis.sent }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ag-ok\" role=\"status\" style=\"font-family: Nunito, sans-serif\">\n<div class=\"ag-ok-ic\"><svg sc-camel-view-box=\"0 0 312 312\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><path class=\"m-box\" style=\"transform-box: fill-box; transform-origin: center; transform: {{ ic.b.t }}; opacity: {{ ic.b.o }}; transition: transform 1s cubic-bezier(.22,1,.36,1) 0s, opacity .5s ease 0s\" d=\"M252 156.11V114.497C252 95.997 236.972 81 218.435 81H155.5H92.5652C74.0277 81 59 95.997 59 114.497V197.724C59 216.224 74.0277 231.22 92.5652 231.22H195.5\" stroke-width=\"18\" stroke=\"#20409A\"><\u002Fpath><path class=\"m-flap\" style=\"transform-box: fill-box; transform-origin: center; transform: {{ ic.f.t }}; opacity: {{ ic.f.o }}; transition: transform 1s cubic-bezier(.22,1,.36,1) .12s, opacity .5s ease .12s\" d=\"M129 133L144.691 142.277C153.838 147.685 157.495 147.685 166.643 142.277L182.333 133\" stroke-width=\"18\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke=\"#F36F21\"><\u002Fpath><path class=\"m-chk\" style=\"transform-box: fill-box; transform-origin: center; transform: {{ ic.c.t }}; opacity: {{ ic.c.o }}; transition: transform 1s cubic-bezier(.22,1,.36,1) .24s, opacity .5s ease .24s\" d=\"M213 194L235.5 216.5L281 171\" stroke-width=\"18\" stroke-linecap=\"round\" stroke=\"#F36F21\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"ag-ok-body\">\n<h3 class=\"ag-ok-h\" style=\"font-weight: 900; color: #f36f21\">Mensagem recebida, {{ ok.first }}!<\u002Fh3>\n<div class=\"ag-txt\" style=\"font-weight: 500; color: #20409a\"><p>Nossa equipe de admissão entra em contato via e-mail ou WhatsApp para confirmar sua visita, de preferência {{ ok.quando }}.<\u002Fp><p>Será um prazer receber você!<\u002Fp><\u002Fdiv>\n<button class=\"ag-b bt bt-light\" type=\"button\" sc-camel-on-click=\"{{ h.edit }}\" style=\"color: #20409a; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Revisar minha mensagem<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fform>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 02 TIRE SUAS DÚVIDAS ============ -->\n<section id=\"duvidas\" class=\"ag-w ag-faq {{ cls.faq }}\">\n<div class=\"ag-faq-top\">\n<div class=\"ag-tag\" style=\"font-family: Nunito, sans-serif; font-weight: 800; color: #6b6b6b\">02 · Agende uma visita<\u002Fdiv>\n<h2 class=\"ag-h2\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #f36f21\"><span class=\"cal-ln\"><span>Tire suas dúvidas<\u002Fspan><\u002Fspan><\u002Fh2>\n<\u002Fdiv>\n<div class=\"ag-faq-in\">\n<div class=\"ag-faq-hd\">\n\n<div class=\"ag-txt rv d1\" style=\"font-family: Nunito, sans-serif; font-weight: 500; color: #20409a\"><p>Cada família possui dúvidas sobre proposta pedagógica, estrutura, valores institucionais ou rotina escolar. A equipe do CAL está preparada para respondê-las com transparência.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"fq-list\" style=\"font-family: Nunito, sans-serif\">\n<div class=\"fq {{ fq.c0 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q0\" aria-controls=\"fq-a0\" aria-expanded=\"{{ fq.e0 }}\" sc-camel-on-click=\"{{ fq.t0 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">01<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Quando abrem as matrículas para o próximo ano letivo?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a0\" role=\"region\" aria-labelledby=\"fq-q0\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">As matrículas geralmente são abertas no segundo semestre, mas o colégio mantém um canal de interesse ativo durante todo o ano para as famílias que desejam planejar o futuro dos seus filhos com antecedência.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c1 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q1\" aria-controls=\"fq-a1\" aria-expanded=\"{{ fq.e1 }}\" sc-camel-on-click=\"{{ fq.t1 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">02<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Como funciona o processo de pré-matrícula (Manifestação de Interesse)?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a1\" role=\"region\" aria-labelledby=\"fq-q1\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">A pré-matrícula começa com o preenchimento do formulário de interesse em nosso site. Após o envio, nossa equipe de admissão entra em contato via e-mail ou WhatsApp para fornecer um feedback imediato e agendar os próximos passos, garantindo que você nunca se sinta perdido no processo.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c2 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q2\" aria-controls=\"fq-a2\" aria-expanded=\"{{ fq.e2 }}\" sc-camel-on-click=\"{{ fq.t2 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">03<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Qual é a idade mínima para ingresso na Educação Infantil?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a2\" role=\"region\" aria-labelledby=\"fq-q2\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Atendemos crianças a partir de 1 ano e 6 meses. O colégio possui espaços exclusivos e \"sob medida\" para esta fase, garantindo um ambiente seguro e motivador para a primeira infância.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c3 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q3\" aria-controls=\"fq-a3\" aria-expanded=\"{{ fq.e3 }}\" sc-camel-on-click=\"{{ fq.t3 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">04<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">O colégio realiza prova de seleção para novos alunos?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a3\" role=\"region\" aria-labelledby=\"fq-q3\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Mais do que uma avaliação técnica, realizamos um momento de integração e escuta atenta. O objetivo é reconhecer a singularidade do candidato, entender seu histórico escolar e socioemocional, e alinhar as expectativas da família com o nosso projeto pedagógico de excelência.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c4 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q4\" aria-controls=\"fq-a4\" aria-expanded=\"{{ fq.e4 }}\" sc-camel-on-click=\"{{ fq.t4 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">05<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Quais documentos são necessários para a matrícula?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a4\" role=\"region\" aria-labelledby=\"fq-q4\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Durante a visita pedagógica, entregamos um checklist completo. Geralmente, são solicitados documentos de identificação (aluno e responsáveis), comprovante de residência e o histórico escolar para alunos que ingressam a partir do Ensino Fundamental I.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c5 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q5\" aria-controls=\"fq-a5\" aria-expanded=\"{{ fq.e5 }}\" sc-camel-on-click=\"{{ fq.t5 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">06<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Posso agendar uma visita individualizada antes de decidir?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a5\" role=\"region\" aria-labelledby=\"fq-q5\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Sim. Acreditamos que a escolha da escola é uma decisão de confiança. Oferecemos visitas onde os pais podem conhecer de perto nossos ambientes, como o Parque da Mangueira ou o Rooftop do Ensino Médio, e conversar diretamente com a coordenação para entender como o conhecimento ganha vida na prática.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c6 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q6\" aria-controls=\"fq-a6\" aria-expanded=\"{{ fq.e6 }}\" sc-camel-on-click=\"{{ fq.t6 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">07<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Quais segmentos o CAL oferece?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a6\" role=\"region\" aria-labelledby=\"fq-q6\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Atendemos da Educação Infantil ao Ensino Médio, passando pelo Ensino Fundamental I e II. Assim, a trajetória escolar pode ser feita inteira no CAL, com acompanhamento próximo em cada etapa.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c7 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q7\" aria-controls=\"fq-a7\" aria-expanded=\"{{ fq.e7 }}\" sc-camel-on-click=\"{{ fq.t7 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">08<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">O CAL é uma escola laica?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a7\" role=\"region\" aria-labelledby=\"fq-q7\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Sim. Desde 1966, o CAL é uma escola laica, plural e próxima de cada aluno, que acolhe famílias de diferentes origens e valoriza a convivência com a diversidade.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c8 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q8\" aria-controls=\"fq-a8\" aria-expanded=\"{{ fq.e8 }}\" sc-camel-on-click=\"{{ fq.t8 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">09<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">O colégio oferece Período Ampliado?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a8\" role=\"region\" aria-labelledby=\"fq-q8\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Sim. O Período Ampliado complementa a rotina escolar no contraturno. Durante a visita, a equipe apresenta a programação, os horários e as condições de cada segmento.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c9 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q9\" aria-controls=\"fq-a9\" aria-expanded=\"{{ fq.e9 }}\" sc-camel-on-click=\"{{ fq.t9 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">10<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Que atividades os alunos têm além da sala de aula?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a9\" role=\"region\" aria-labelledby=\"fq-q9\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Xadrez, esportes e ginástica rítmica; tecnologia, robótica e pensamento computacional; internacionalização e o Núcleo de Ação Social (NAS), entre outras iniciativas que ampliam a formação dos alunos.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c10 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q10\" aria-controls=\"fq-a10\" aria-expanded=\"{{ fq.e10 }}\" sc-camel-on-click=\"{{ fq.t10 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">11<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Como é feito o acompanhamento de cada aluno?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a10\" role=\"region\" aria-labelledby=\"fq-q10\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">O acompanhamento é individual: a equipe pedagógica observa de perto a trajetória de cada aluno e mantém um diálogo constante com as famílias ao longo de todo o ano.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"fq {{ fq.c11 }}\"><h3 class=\"fq-h\"><button class=\"fq-q\" type=\"button\" id=\"fq-q11\" aria-controls=\"fq-a11\" aria-expanded=\"{{ fq.e11 }}\" sc-camel-on-click=\"{{ fq.t11 }}\"><span class=\"fq-n\" style=\"color: #f36f21\">12<\u002Fspan><span class=\"fq-t\" style=\"color: #20409a\">Posso tirar dúvidas sem agendar uma visita?<\u002Fspan><span class=\"fq-ic\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M2 9H16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path class=\"v\" d=\"M9 2V16\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"fq-a\" id=\"fq-a11\" role=\"region\" aria-labelledby=\"fq-q11\"><div class=\"fq-in\"><p style=\"font-weight: 500; color: #404040\">Pode. Escreva no campo de dúvidas e comentários do formulário ou use o Fale conosco: nossa equipe responde com transparência e no tempo da sua família.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<div id=\"frase\" class=\"ag-w ag-stmt {{ cls.frase }}\">\n<p class=\"ag-stmt-h\" style=\"font-family: Nunito, sans-serif; font-weight: 900; color: #20409a\"><span class=\"cal-ln\"><span>Será um prazer <span style=\"color: #f36f21\">receber você!<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fp>\n<a class=\"ag-b bt rv d1\" href=\"#agendar\" style=\"color: #ffffff; font-family: 'Nunito Sans', Nunito, sans-serif; font-weight: 800\">Agendar m llingElement || sc === document.documentElement;\n    const vh = isDoc ? (window.innerHeight || 800) : sc.clientHeight;\n    const top0 = isDoc ? 0 : sc.getBoundingClientRect().top;\n    const r = el.getBoundingClientRect();\n    const relTop = r.top - top0, relBot = r.bottom - top0;\n    if (relBot <= vh * 0.88 && relTop >= 96) return;\n    const want = Math.max(110, vh * 0.5 - Math.min(r.height, vh * 0.6) / 2);\n    const from = sc.scrollTop;\n    const to = Math.max(0, from + relTop - want);\n    if (Math.abs(to - from) < 4) return;\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) { sc.scrollTop = to; return; }\n    if (this.rafS) cancelAnimationFrame(this.rafS);\n    const dur = 1000, t0 = performance.now();\n    const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\n    const step = (now) => {\n      const t = Math.min(1, (now - t0) / dur);\n      sc.scrollTop = from + (to - from) * ease(t);\n      this.rafS = t < 1 ? requestAnimationFrame(step) : 0;\n    };\n    this.rafS = requestAnimationFrame(step);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.ffScroll, { capture: true });\n    window.removeEventListener('scroll', this.onScroll, { capture: true });\n    window.removeEventListener('resize', this.onScroll);\n    if (this.rafFS) cancelAnimationFrame(this.rafFS);\n    if (this.rafS) cancelAnimationFrame(this.rafS);\n    if (this.stepT) clearTimeout(this.stepT);\n    if (this.rafF) cancelAnimationFrame(this.rafF);\n    if (this.raf) cancelAnimationFrame(this.raf);\n    [this.revT, this.topoT, this.fallT, this.reT].forEach((t) => { if (t) clearTimeout(t); });\n    if (this.ioRaiz) this.ioRaiz.disconnect();\n  }\n  q(id) {\n    if (this.root) { const el = this.root.querySelector('#' + id); if (el) return el; }\n    return typeof document !== 'undefined' ? document.getElementById(id) : null;\n  }\n  measure() {\n    if (!this.ready) return;\n    const vh = window.innerHeight || 1000;\n    const tall = vh > 2600;\n    const seen = Object.assign({}, this.state.seen || {});\n    let sc = false;\n    for (let i = 0; i < this.tIds.length; i++) {\n      const id = this.tIds[i];\n      if (seen[id]) continue;\n      const el = this.q(id);\n      if (!el) continue;\n      const r = el.getBoundingClientRect();\n      if (tall || (r.height > 0 && r.top + Math.min(160, r.height * 0.3) < vh * 0.8)) { seen[id] = true; sc = true; }\n    }\n    if (sc) this.setState({ seen: seen });\n  }\n  quica(dy) {\n    if (!this.ff) this.ff = { a: 0, va: 0, b: 0, vb: 0 };\n    const f = this.ff;\n    const cl = (v) => Math.max(-300, Math.min(300, v));\n    f.va = cl(f.va + dy * 0.55);\n    f.vb = cl(f.vb + dy * 0.85);\n    if (this.rafF) return;\n    let last = 0;\n    const passo = (t) => {\n      this.rafF = 0;\n      const dt = last ? Math.min(0.034, (t - last) / 1000) : 0.016;\n      last = t;\n      f.va += (-95 * f.a - 8 * f.va) * dt; f.a += f.va * dt;\n      f.vb += (-48 * f.b - 4.2 * f.vb) * dt; f.b += f.vb * dt;\n      f.a = Math.max(-18, Math.min(18, f.a)); f.b = Math.max(-24, Math.min(24, f.b));\n      const A = Math.round(f.a * 10) / 10, B = Math.round(f.b * 10) / 10;\n      if (A !== this.state.ffA || B !== this.state.ffB) this.setState({ ffA: A, ffB: B });\n      if (Math.abs(f.a) < 0.05 && Math.abs(f.va) < 0.5 && Math.abs(f.b) < 0.05 && Math.abs(f.vb) < 0.5) {\n        f.a = f.va = f.b = f.vb = 0; this.setState({ ffA: 0, ffB: 0 }); return;\n      }\n      this.rafF = requestAnimationFrame(passo);\n    };\n    this.rafF = requestAnimationFrame(passo);\n  }\n  renderVals() {\n    const s = this.state.seen || {};\n    const f = this.state.f;\n    const v = this.valid(f);\n    const reach = this.state.reach || 0;\n    let cur = 0;\n    while (cur < 6 && v[cur]) cur++;\n    // etapas\n    const st = {};\n    const vis = { form: true, send: !this.state.sent, sent: !!this.state.sent };\n    for (let i = 0; i <= 6; i++) {\n      const done = i < 6 ? v[i] : (f.msg || '').trim().length > 0;\n      const c = [];\n      if (done) c.push('done');\n      if (i === cur && i < 6) c.push('cur');\n      if (i < reach && done) c.push('lnk');\n      if (i >= reach || i === 6) c.push('end');\n      st['c' + i] = c.join(' ');\n      if (i > 0) vis['s' + i] = i <= reach;\n    }\n    // filhos\n    const kc = { n: String(f.n), lab: f.n > 1 ? 'filhos' : 'filho', minus: f.n <= 1, plus: f.n >= this.MAXK };\n    const kids = (f.series || []).map((val, i) => ({\n      id: 'ag-serie-' + i,\n      lab: this.ORD[i],\n      val: val,\n      cls: val ? 'ok' : '',\n      onCh: (e) => this.setSerie(i, e && e.target ? e.target.value : '')\n    }));\n    const dia = this.DIAS.find((d) => d.k === f.dia);\n    const dias = this.DIAS.map((d) => ({\n      l: d.l, L: d.L,\n      cls: f.dia === d.k ? 'sel' : '',\n      pr: f.dia === d.k ? 'true' : 'false',\n      pick: () => this.upd({ dia: d.k })\n    }));\n    const horas = this.HORAS.map((hh) => ({\n      l: hh,\n      cls: f.hora === hh ? 'sel' : '',\n      pr: f.hora === hh ? 'true' : 'false',\n      pick: () => this.upd({ hora: hh })\n    }));\n    // resumo\n    const vazio = 'a preencher';\n    const nome = (f.nome || '').trim();\n    const contato = [v[1] ? f.email : '', v[2] ? f.tel : ''].filter(Boolean).join(' · ');\n    const filled = (f.series || []).filter(Boolean);\n    const filhos = f.n ? (f.n + (f.n > 1 ? ' filhos' : ' filho') + (filled.length ? ': ' + filled.join(', ') : '')) : '';\n    const pref = [dia ? dia.L : '', f.hora ? 'às ' + f.hora : ''].filter(Boolean).join(', ');\n    const nOk = v.filter(Boolean).length;\n    const left = 6 - nOk;\n    const quando = (dia ? dia.P : '') + (f.hora ? ', às ' + f.hora : '');\n    // faq\n    const fq = {};\n    const open = this.state.open || {};\n    for (let i = 0; i < 12; i++) {\n      fq['c' + i] = open[i] ? 'open' : '';\n      fq['e' + i] = open[i] ? 'true' : 'false';\n      fq['t' + i] = () => {\n        const o = Object.assign({}, this.state.open || {});\n        o[i] = !o[i];\n        this.setState({ open: o });\n      };\n    }\n    return {\n      ffA: this.state.ffA || 0, ffB: this.state.ffB || 0,\n      setRoot: this.setRoot,\n      cls: {\n        topo: s.topo ? 'is-in' : '',\n        form: s.agendar ? 'is-in' : '',\n        faq: s.duvidas ? 'is-in' : '',\n        frase: s.frase ? 'is-in' : ''\n      },\n      f: f,\n      h: this.h,\n      st: st,\n      vis: vis,\n      kc: kc,\n      kids: kids,\n      dias: dias,\n      horas: horas,\n      sm: {\n        nome: v[0] ? nome : vazio, c1: v[0] ? 'on' : '',\n        contato: contato || vazio, c2: v[1] && v[2] ? 'on' : '',\n        filhos: filhos || vazio, c3: v[3] && v[4] ? 'on' : '',\n        pref: pref || vazio, c4: v[5] ? 'on' : ''\n      },\n      prog: {\n        txt: nOk + ' de 6 etapas',\n        pctTxt: Math.round(nOk / 6 * 100) + '%',\n        pct: (nOk / 6 * 100).toFixed(1) + '%'\n      },\n      ok: {\n        dis: left > 0,\n        txt: left > 0 ? (left === 1 ? 'Falta 1 etapa obrigatória' : 'Faltam ' + left + ' etapas obrigatórias') : 'Tudo pronto para enviar',\n        first: nome.split(/\\s+/)[0] || '',\n        quando: quando || 'no dia escolhido'\n      },\n      ic: (() => {\n        const on = !!this.state.icIn;\n        const mk = (x, y, r, sc) => ({ t: on ? 'translate(0px, 0px) rotate(0deg) scale(1)' : 'translate(' + x + 'px, ' + y + 'px) rotate(' + r + 'deg) scale(' + sc + ')', o: on ? 1 : 0 });\n        return { b: mk(-110, 70, -25, 0.7), f: mk(0, -130, 0, 0.5), c: mk(130, 90, 35, 0.6) };\n      })(),\n      fq: fq\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
